name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-edge.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  DO_NOT_TRACK: 1
  RELEASE_TAG: ${{ github.ref_name }}
  SHELL: /bin/bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24"

      - name: Install direnv
        run: curl -fsSL https://direnv.net/install.sh | bash

      - name: Authorize direnv
        run: direnv allow && direnv export bash

      - name: Setup Dagger
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          verb: core
          args: "engine local-cache"

      - name: Publish Dagger Release
        uses: stateful/runme-action@v2
        with:
          workflows: GhaRelease
        env:
          CONNECTION_STR: ${{ secrets.CONNECTION_STR }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTRUMENTATION_KEY: ${{ secrets.INSTRUMENTATION_KEY }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
