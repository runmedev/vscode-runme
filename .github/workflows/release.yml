name: Release

on:
  workflow_run:
    workflows:
      - Pipeline
    branches:
      - main
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  DO_NOT_TRACK: 1
  RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
  SHELL: /bin/bash

jobs:
  release:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24"

      - name: Install direnv
        run: curl -fsSL https://direnv.net/install.sh | bash

      - name: Authorize direnv
        run: direnv allow && direnv export bash

      - name: Setup Dagger
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          verb: core
          args: "engine local-cache"

      - name: Publish Dagger Release
        uses: stateful/runme-action@v2
        with:
          workflows: GhaRelease
        env:
          CONNECTION_STR: ${{ secrets.CONNECTION_STR }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTRUMENTATION_KEY: ${{ secrets.INSTRUMENTATION_KEY }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
